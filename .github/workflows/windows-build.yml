name: Build Boomify (Windows)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Compile Windows x64
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure MSVC x64
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build Release
        run: cmake --build build --config Release --parallel 2

      - name: Verify executable
        shell: pwsh
        run: |
          if (-not (Test-Path 'build/Release/Boomify.exe')) {
            throw 'Boomify.exe was not generated.'
          }
          Get-Item 'build/Release/Boomify.exe' | Select-Object Name, Length

      - name: Upload compiled application
        uses: actions/upload-artifact@v4
        with:
          name: Boomify-Windows-x64
          path: build/Release/Boomify.exe
          if-no-files-found: error
          retention-days: 14
