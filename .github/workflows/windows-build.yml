name: Build Boomify (Windows)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Compile Windows x64
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure MSVC x64
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DBOOMIFY_BUILD_SHA="${{ github.sha }}"

      - name: Build Release
        run: cmake --build build --config Release --parallel 2

      - name: Audio engine regression tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Verify executable
        shell: pwsh
        run: |
          if (-not (Test-Path 'build/Release/Boomify.exe')) {
            throw 'Boomify.exe was not generated.'
          }
          Get-Item 'build/Release/Boomify.exe' | Select-Object Name, Length

      - name: Upload compiled application
        uses: actions/upload-artifact@v4
        with:
          name: Boomify-Windows-x64
          path: build/Release/Boomify.exe
          if-no-files-found: error
          retention-days: 14

      - name: Generate update manifest
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          $sha = "${{ github.sha }}"
          $digest = (Get-FileHash "build/Release/Boomify.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          @($sha, $digest) | Set-Content -Path "build/Release/version.txt" -Encoding ascii

      - name: Publish rolling alpha update
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view alpha-rolling --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create alpha-rolling --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "Boomify Alpha - mises a jour" --notes "Canal de mises a jour automatiques de Boomify. Developpement alpha : sauvegardez vos projets avant chaque mise a jour." --prerelease
            if ($LASTEXITCODE -ne 0) { throw "Failed to create rolling alpha release" }
          }
          gh release upload alpha-rolling "build/Release/Boomify.exe#Boomify.exe" --clobber --repo "${{ github.repository }}"
          if ($LASTEXITCODE -ne 0) { throw "Failed to upload Boomify executable" }
          gh release upload alpha-rolling "build/Release/version.txt#version.txt" --clobber --repo "${{ github.repository }}"
          if ($LASTEXITCODE -ne 0) { throw "Failed to upload version manifest" }
